name: Update devq formula
on:
  repository_dispatch:
    types: [update-devq]
  workflow_dispatch:
    inputs:
      version:
        description: 'New version of devq (no leading v)'
        required: true
jobs:
  devq:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Update Formula
        env:
          VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: $VERSION"; exit 1; }
          sums=$(curl -fsSL "https://github.com/mikepenz/agent-device-orchestrator/releases/download/v${VERSION}/CHECKSUMS-SHA256.txt")
          sha() { grep -F "devq-${VERSION}-$1.tar.gz" <<<"$sums" | cut -d' ' -f1 | grep -E '^[0-9a-f]{64}$'; }
          sed -e "s/\${VERSION}/$VERSION/" \
              -e "s/\${SHA_AARCH64_DARWIN}/$(sha aarch64-apple-darwin)/" \
              -e "s/\${SHA_X86_64_DARWIN}/$(sha x86_64-apple-darwin)/" \
              -e "s/\${SHA_AARCH64_LINUX}/$(sha aarch64-unknown-linux-gnu)/" \
              -e "s/\${SHA_X86_64_LINUX}/$(sha x86_64-unknown-linux-gnu)/" \
              .template/devq.rb > Formula/devq.rb

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: Update devq to ${{ github.event.client_payload.version || github.event.inputs.version }}
          title: Update devq to ${{ github.event.client_payload.version || github.event.inputs.version }}
          branch: update-devq
          base: main
